<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Long Division Guide</title>
<style>
  /* ===== Shared look from the Standard Algorithm Multiplication Guide ===== */
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 700px;
    margin: 0 auto;
    padding: 16px;
    background: #f8f9fa;
    color: #222;
  }
  h1 { font-size: 1.4rem; text-align: center; margin-bottom: 0.5rem; }
  .subtitle { text-align: center; color: #555; margin-bottom: 1.5rem; font-size: 0.95rem; }
  .input-row {
    display: flex; gap: 12px; justify-content: center; align-items: center;
    flex-wrap: wrap; margin-bottom: 16px;
  }
  input.num {
    font-size: 1.3rem; padding: 8px 12px; width: 140px;
    border: 2px solid #ccc; border-radius: 8px; text-align: right;
    font-family: inherit;
  }
  input.num:focus { outline: none; border-color: #0066cc; }
  button {
    font-size: 1.05rem; padding: 10px 20px; border: none; border-radius: 8px;
    background: #0066cc; color: white; cursor: pointer; min-height: 44px;
    font-family: inherit;
  }
  button:disabled { background: #aaa; cursor: not-allowed; }
  button.secondary { background: #555; }
  button.secondary:disabled { background: #ccc; color: #f4f4f4; }
  button.big { font-size: 1.3rem; padding: 14px 36px; }
  .step-box {
    background: #fff3cd; border: 2px solid #ffc107; border-radius: 10px;
    padding: 16px; margin: 16px 0; font-size: 1.15rem; line-height: 1.5;
  }
  .step-box strong { color: #856404; }
  .input-area { margin-top: 12px; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .check-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .input-area input {
    font-size: 1.5rem; width: 110px; padding: 6px 10px;
    border: 2px solid #ccc; border-radius: 6px; text-align: right; font-family: inherit;
  }
  .input-area input:focus { outline: none; border-color: #0066cc; }
  .visual-side {
    font-family: 'Courier New', monospace; font-size: 1.2rem; background: #f8f9fa;
    border: 1px solid #ddd; border-radius: 6px; padding: 8px; line-height: 1; display: inline-block;
  }
  .feedback { margin-top: 10px; font-weight: bold; min-height: 1.4em; }
  .feedback.correct { color: #28a745; }
  .feedback.wrong { color: #dc3545; }
  .write-instruction {
    margin-top: 12px; padding: 10px; background: #e7f3ff;
    border-left: 4px solid #0066cc; border-radius: 4px;
  }
  .controls { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .progress { text-align: center; color: #666; margin-top: 8px; font-size: 0.9rem; }
  .final-answer {
    background: #d4edda; border: 2px solid #28a745; border-radius: 10px; padding: 16px;
    text-align: center; font-size: 1.3rem; font-weight: bold; margin-top: 16px;
  }
  .problem-display {
    background: white; border: 2px solid #ddd; border-radius: 10px;
    padding: 16px; margin: 12px 0; overflow-x: auto;
  }

  /* ===== Start screen ===== */
  .settings { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .set-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
  .set-label { font-weight: bold; min-width: 110px; font-size: 1.1rem; }
  .seg { display: inline-flex; border: 2px solid #0066cc; border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
  .seg button { background: white; color: #0066cc; border-radius: 0; padding: 10px 16px; border-right: 1px solid #cfe2f7; }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: #0066cc; color: white; font-weight: bold; }
  .seg button[hidden] { display: none; }
  .set-hint { color: #666; font-size: 0.9rem; }
  .more { margin-top: 10px; color: #555; font-size: 0.9rem; }
  .more summary { cursor: pointer; padding: 6px 0; }
  .more label { display: inline-flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; }
  .more input[type=checkbox] { width: 20px; height: 20px; }
  .start-wrap { text-align: center; margin: 18px 0; }

  /* ===== Main screen ===== */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .topbar button { padding: 8px 14px; font-size: 0.95rem; }
  .ptitle { font-size: 1.3rem; font-weight: bold; text-align: center; }
  .ptitle .tag { display: block; font-size: 0.8rem; font-weight: normal; color: #666; }
  .loop { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; margin-top: 10px; font-size: 0.9rem; }
  .loop span { padding: 3px 10px; border-radius: 999px; background: #e9ecef; color: #555; }
  .loop span.on { background: #0066cc; color: white; font-weight: bold; }
  .loop i { color: #aaa; font-style: normal; align-self: center; }

  /* Division bracket, built from positioned cells */
  .bracket { position: relative; margin: 0 auto; font-family: 'Courier New', monospace; font-weight: bold; }
  .cell {
    position: absolute; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; color: #222; box-sizing: border-box;
  }
  .cell.slot { border: 2px dashed #c8d3de; color: #0066cc; }
  .cell.slot.filled { border-color: transparent; }
  .cell.qx { color: #888; }
  .cell.divisor { color: #222; }
  .cell.used { color: #9aa4ad; }
  .cell.used::after { content: "↓"; position: absolute; bottom: -0.55em; font-size: 0.45em; color: #9aa4ad; }
  .cell.op { color: #555; }
  .cell.hl { background: #fff3cd; box-shadow: inset 0 0 0 2px #ffc107; }
  .cell.target { background: #e7f3ff; box-shadow: inset 0 0 0 2px #0066cc; color: #0066cc; }
  .cell.next { animation: pulse 1s ease-in-out infinite; }
  .cell.dest { border: 2px dashed #ffc107; }
  .cell.target { animation: tpulse 1.1s ease-in-out infinite; }
  .cell.align { outline: 2px dashed #0066cc; outline-offset: -3px; border-radius: 6px; }
  .hline.target-line { background: #0066cc; animation: lpulse 1.1s ease-in-out infinite; }
  .cell.qfrac { color: #0066cc; font-size: 0.55em; }
  .cell.qfrac .fbar { border-top-width: 2px; }
  @keyframes tpulse { 0%,100% { box-shadow: inset 0 0 0 2px #0066cc; } 50% { box-shadow: inset 0 0 0 4px #0066cc, 0 0 0 4px rgba(0,102,204,.25); } }
  @keyframes lpulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .hline { position: absolute; height: 3px; background: #222; border-radius: 2px; }
  .bar-top { position: absolute; height: 4px; background: #222; border-radius: 2px; }
  .bar-curve { position: absolute; border-right: 4px solid #222; border-radius: 0 60% 60% 0 / 0 50% 50% 0; box-sizing: border-box; }
  .pop { animation: pop 0.5s ease-out; }
  .appear { animation: appear 0.45s ease-out; }
  .drop { animation: drop 0.9s cubic-bezier(.3,.7,.4,1); }
  @keyframes pop { from { transform: translateY(-28px) scale(1.5); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes appear { from { opacity: 0; transform: scale(1.3); } to { opacity: 1; transform: none; } }
  @keyframes drop { 0% { transform: translateY(var(--dy)); color: #d35400; } 70% { color: #d35400; } 100% { transform: none; } }
  @keyframes pulse { 0%,100% { box-shadow: inset 0 0 0 2px #ffc107; } 50% { box-shadow: inset 0 0 0 4px #d35400; } }
  @media (prefers-reduced-motion: reduce) { .pop, .appear, .drop, .next { animation: none; } }

  /* Step panel bits */
  .ask { font-size: 1.35rem; margin: 6px 0; }
  .ask b { color: #0066cc; font-size: 1.5rem; }
  .tries { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .try { display: inline-flex; align-items: center; gap: 6px; background: #fdecee; border: 2px solid #dc3545; color: #dc3545; border-radius: 8px; padding: 2px 10px; font-weight: bold; font-size: 1.1rem; }
  .try .x { font-size: 1.3rem; }
  .try small { font-weight: normal; color: #a12a36; font-size: 0.8rem; }
  .mini { font-family: 'Courier New', monospace; font-size: 1.8rem; font-weight: bold; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 10px 16px; display: inline-block; }
  .mini .mrow { display: flex; justify-content: flex-end; align-items: center; gap: 10px; height: 2.1rem; }
  .mini .mrow .opc { color: #555; width: 1ch; }
  .mini .mline { border-top: 3px solid #222; margin: 4px 0 6px; }
  .mini input { font-family: 'Courier New', monospace; font-size: 1.7rem; font-weight: bold; width: 5ch; padding: 2px 6px; border: 2px solid #ccc; border-radius: 6px; text-align: right; }
  .mini input:focus { outline: none; border-color: #0066cc; }
  .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 4px; line-height: 1.1; }
  .frac .fbar { border-top: 3px solid currentColor; width: 100%; margin: 3px 0; }
  .frac input { width: 4ch; font-size: 1.5rem; text-align: center; }
  .final-answer .frac { font-size: 0.85em; }
  .gate-check { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 14px; background: white; border: 2px solid #0066cc; border-radius: 10px; cursor: pointer; font-size: 1.2rem; font-weight: bold; color: #0066cc; user-select: none; }
  .gate-check input { width: 32px; height: 32px; accent-color: #28a745; cursor: pointer; flex: none; }
  .gate-title { font-weight: bold; color: #0066cc; }
  .hint { color: #856404; font-size: 1rem; margin-top: 6px; }
  .hidden { display: none !important; }

  /* ===== Simplicity pass ===== */
  .set-label small { display: block; font-weight: normal; color: #777; font-size: 0.8rem; }
  .own { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 14px 16px; margin-top: 8px; text-align: center; }
  .own-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 8px; }
  .own-row { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; font-size: 1.2rem; }
  .own-row input.num { width: 120px; }
  .own-row input.num.small { width: 80px; }
  .more { text-align: center; margin-top: 14px; }
  button.link { background: none; color: #0066cc; padding: 6px 4px; font-size: 1rem; min-height: 0; }
  .topbar-spacer { width: 70px; }
  .step-box { text-align: center; padding: 20px 16px; }
  .step-box .input-area { justify-content: center; align-items: center; }
  .ask { font-size: 1.4rem; margin: 0 0 6px; }
  .tries { justify-content: center; gap: 6px; }
  .try { font-size: 1rem; padding: 0 8px; border-width: 1px; }
  .feedback { font-size: 1.1rem; }
  .gate-head { font-size: 1.45rem; font-weight: bold; color: #0066cc; }
  .gate-text { font-size: 1.3rem; margin: 6px 0 4px; }
  .write-instruction { text-align: center; padding: 16px; border-left-width: 6px; margin-top: 0; }
  .gate-check { justify-content: center; max-width: 340px; margin: 12px auto 0; font-size: 1.25rem; }
  .gate-check:hover { background: #f2f8ff; }
  .loop { gap: 2px; margin-top: 4px; font-size: 0.8rem; }
  .loop span { background: none; color: #aaa; padding: 2px 6px; }
  .loop span.on { background: none; color: #0066cc; font-weight: bold; text-decoration: underline; text-underline-offset: 4px; }
  .loop i { color: #ccc; }
  .problem-display { padding: 12px; }
  .step-box.gate { background: #e7f3ff; border: 3px solid #0066cc; }
  .step-box.gate strong { color: #0066cc; }
  .feedback:empty { min-height: 0; margin: 0; }
  .bracket { margin-top: 8px; }
  .mini-note { color: #777; font-size: 0.9rem; }
  .input-area input#answerInput, .input-area input.answer { width: 120px; font-size: 1.8rem; text-align: center; }
  button.check { font-size: 1.25rem; padding: 12px 28px; }
  button.yn { font-size: 1.5rem; padding: 14px 40px; min-width: 130px; }
  .ask b { font-size: 1.6rem; }
  .frac-labels { display: flex; flex-direction: column; justify-content: space-between; height: 5.2rem; font-size: 0.85rem; color: #777; font-family: system-ui, sans-serif; font-weight: normal; text-align: left; }

  /* ===== Estimate gate + reasonableness ===== */

  .est-row { display: flex; align-items: flex-start; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .est-field { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: text; }
  .est-field input { font-size: 1.7rem; width: 120px; padding: 8px; border: 2px solid #ccc; border-radius: 8px; text-align: center; font-family: inherit; font-weight: bold; }
  .est-field input:focus { outline: none; border-color: #0066cc; }
  .est-field input.q { border-color: #0066cc; background: #f2f8ff; }
  .est-field small { color: #666; font-size: 0.85rem; }
  .est-op { font-size: 1.9rem; font-weight: bold; padding-top: 10px; color: #555; }
  .est-checks { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }
  .chk { padding: 4px 12px; border-radius: 999px; font-size: 0.95rem; background: #eef1f4; color: #888; border: 2px solid transparent; }
  .chk.good { background: #e6f6ea; color: #1e7e34; border-color: #28a745; font-weight: bold; }

  .est-good .try-pair { background: #e6f6ea; color: #1e7e34; }
  .reason-compare { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 10px 0 4px; }
  .reason-compare > div { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 8px 18px; min-width: 130px; }
  .reason-compare small { display: block; color: #666; font-size: 0.9rem; }

  .recheck { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 12px; }
  .recheck button.pick { min-width: 280px; font-size: 1.2rem; padding: 14px 20px; background: white; color: #0066cc; border: 2px solid #0066cc; }
  .recheck button.pick:hover { background: #f2f8ff; }

  @media (max-width: 480px) { .est-row { gap: 4px; } .est-field input { width: 88px; box-sizing: border-box; font-size: 1.4rem; padding: 8px 4px; } .est-op { font-size: 1.5rem; } .est-field small { font-size: 0.75rem; max-width: 90px; text-align: center; } }

<body>

<!-- ================= START SCREEN ================= -->
<section id="startScreen">
  <h1>Long Division Guide</h1>
  <p class="subtitle">✏️ Get your pencil and grid paper ready.</p>

  <div class="settings">
    <div class="set-row">
      <span class="set-label">Divisor<small>divide by</small></span>
      <div class="seg" id="segDivisor">
        <button data-v="1">1 digit</button>
        <button data-v="2">2 digits</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-label">Dividend<small>number to divide</small></span>
      <div class="seg" id="segDividend">
        <button data-v="2">2 digits</button>
        <button data-v="3">3 digits</button>
        <button data-v="4">4 digits</button>
        <button data-v="5" hidden>5 digits</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-label">Remainders</span>
      <div class="seg" id="segRem">
        <button data-v="off">Off</button>
        <button data-v="on">On</button>
      </div>
    </div>
  </div>

  <div class="start-wrap">
    <button class="big" id="startBtn" onclick="startPractice()">Start ▶</button>
  </div>

  <div class="own">
    <div class="own-title">Try your own problem</div>
    <div class="own-row">
      <span>Divide</span>
      <input class="num" id="customDividend" inputmode="numeric" autocomplete="off" aria-label="Number to divide" onkeydown="if(event.key==='Enter') startCustom()">
      <span>by</span>
      <input class="num small" id="customDivisor" inputmode="numeric" autocomplete="off" aria-label="Divide by" onkeydown="if(event.key==='Enter') startCustom()">
      <button onclick="startCustom()">Go</button>
    </div>
    <div id="ownMsg" class="feedback wrong" aria-live="polite"></div>
  </div>

  <details class="more">
    <summary>Challenge</summary>
    <label><input type="checkbox" id="challenge"> Allow 5-digit dividends</label>
  </details>
</section>

<!-- ================= MAIN SCREEN ================= -->
<section id="mainScreen" class="hidden">
  <div class="topbar">
    <button class="link" onclick="showStart()">← Menu</button>
    <div class="ptitle" id="ptitle"></div>
    <span class="topbar-spacer"></span>
  </div>
  <div class="loop" id="loop"></div>

  <div class="problem-display"><div id="bracket" class="bracket"></div></div>
  <div id="step" class="step-box" aria-live="polite"></div>
  <div id="final" class="final-answer hidden"></div>
  <div class="controls">
    <button id="backBtn" class="secondary" onclick="goBack()">← Back</button>
  </div>
  <div id="progress" class="progress"></div>
</section>

<!-- ============ PURE LOGIC (tested by test.js; no DOM in here) ============ -->
<script id="logic">
const PLACES = ["ones", "tens", "hundreds", "thousands", "ten-thousands", "hundred-thousands"];
function placeName(n, pos) { return PLACES[n - 1 - pos] || "higher"; }

/*
 * Build the full finite-state sequence for dividendStr ÷ divisor (US traditional algorithm).
 * Every step is one state. Input states: check, multiply, subtract, remainder.
 * Action state: bring (tap to bring down). Gate states: kid confirms they wrote it on paper.
 * Leading "doesn't go in" positions are a check whose answer is 0 → marked X, no multiply/subtract,
 * and the partial dividend grows by the next digit.
 */
function buildSteps(dividendStr, divisor) {
  const digits = String(dividendStr).split("").map(Number);
  const n = digits.length;
  const d = divisor;
  const steps = [];
  const quotientDigits = [];   // [{e, q}] real (non-leading) quotient digits
  let partial = digits[0];
  let row = 0;                 // work row where the current partial lives (0 = dividend row)
  let from = 0;                // first column of the current partial's cells
  let leading = true;
  let remainder = 0;
  let maxRow = 0;
  for (let e = 0; e < n; e++) {
    if (e > 0 && leading) partial = partial * 10 + digits[e];
    const q = Math.floor(partial / d);
    const leadingZero = leading && q === 0 && e < n - 1;
    steps.push({ type: "check", d, partial, e, row, from, expected: q, leadingZero, place: placeName(n, e), digit: digits[e] });
    if (leadingZero) {
      steps.push({ type: "gate", kind: "x", d, e, partial, digit: digits[e], place: placeName(n, e), next: partial * 10 + digits[e + 1] });
      continue;
    }
    leading = false;
    quotientDigits.push({ e, q });
    steps.push({ type: "gate", kind: "quotient", d, e, q, digit: digits[e], place: placeName(n, e) });
    const product = q * d;
    steps.push({ type: "multiply", d, q, product, partial, e, row: row + 1, from });
    steps.push({ type: "gate", kind: "product", d, e, product, partial, row: row + 1, digit: digits[e], place: placeName(n, e) });
    const diff = partial - product;
    steps.push({ type: "subtract", d, q, partial, product, diff, e, row: row + 2, from });
    steps.push({ type: "gate", kind: "diff", d, q, e, diff, product, row: row + 2, from, last: e === n - 1, digit: digits[e], place: placeName(n, e) });
    // COMPARE: teach the check "remainder must be smaller than the divisor" (always Yes when work is right; no gate, nothing new to write)
    steps.push({ type: "compare", d, q, e, diff, row: row + 2, expected: diff < d ? "yes" : "no" });
    maxRow = row + 2;
    if (e < n - 1) {
      const newPartial = diff * 10 + digits[e + 1];
      steps.push({ type: "bring", d, digit: digits[e + 1], col: e + 1, row: row + 2, diff, newPartial });
      steps.push({ type: "gate", kind: "bring", d, digit: digits[e + 1], col: e + 1, row: row + 2, diff, newPartial, place: placeName(n, e + 1) });
      partial = newPartial;
      from = e + 1 - String(diff).length;
      row = row + 2;
    } else {
      remainder = diff;
    }
  }
  const quotient = quotientDigits.map(x => x.q).join("").replace(/^0+(?=\d)/, "") || "0";
  if (remainder > 0) {
    steps.push({ type: "remainder", d, num: remainder, den: d, quotient });
    steps.push({ type: "gate", kind: "remainder", d, num: remainder, den: d, quotient, n });
  }
  steps.push({ type: "done", d, quotient, remainder });
  return { dividend: String(dividendStr), divisor: d, n, steps, quotient, remainder, quotientDigits, rows: maxRow + 1 };
}

/* Validate one answer for one state. Returns {ok, kind}. Pure. */
function checkStep(step, raw) {
  if (step.type === "compare") {
    const a = String(raw || "").trim().toLowerCase();
    if (a !== "yes" && a !== "no") return { ok: false, kind: "nan" };
    return a === step.expected ? { ok: true, kind: "ok" } : { ok: false, kind: "wrong" };
  }
  if (step.type === "remainder") {
    const num = parseWhole(raw && raw.num), den = parseWhole(raw && raw.den);
    if (num === null || den === null) return { ok: false, kind: "nan" };
    if (num !== step.num && den !== step.den) return { ok: false, kind: "both" };
    if (num !== step.num) return { ok: false, kind: "num" };
    if (den !== step.den) return { ok: false, kind: "den" };
    return { ok: true, kind: "ok" };
  }
  const v = parseWhole(raw);
  if (v === null) return { ok: false, kind: "nan" };
  if (step.type === "check") {
    if (v * step.d > step.partial) return { ok: false, kind: "tooBig", v, product: v * step.d };
    if (step.partial - v * step.d >= step.d) return { ok: false, kind: "tooSmall", v, product: v * step.d, left: step.partial - v * step.d };
    return { ok: true, kind: "ok", v };
  }
  if (step.type === "multiply") return v === step.product ? { ok: true, kind: "ok", v } : { ok: false, kind: "wrong", v };
  if (step.type === "subtract") return v === step.diff ? { ok: true, kind: "ok", v } : { ok: false, kind: "wrong", v };
  return { ok: false, kind: "notInput" };
}

function parseWhole(raw) {
  if (raw === undefined || raw === null) return null;
  const s = String(raw).trim();
  if (!/^\d{1,7}$/.test(s)) return null;

}

/* Small seeded RNG so tests are repeatable. */
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

function randInt(rng, lo, hi) { return lo + Math.floor(rng() * (hi - lo + 1)); }

/*
 * opts: {divisorDigits: 1|2, dividendDigits: 2..5, remainders: bool}
 * Remainders off → dividend is an exact multiple (clean quotient).
 * Remainders on  → mostly problems that leave a remainder.
 * Dividend always has exactly dividendDigits digits and is >= divisor. Integer math only.
 */
function generateProblem(opts, rng, avoid) {
  rng = rng || Math.random;
  const L = opts.dividendDigits;
  const lo = Math.pow(10, L - 1), hi = Math.pow(10, L) - 1;
  let last = null;
  for (let tries = 0; tries < 500; tries++) {
    const d = opts.divisorDigits === 1 ? randInt(rng, 2, 9) : randInt(rng, 11, 99);
    let N;
    if (!opts.remainders) {
      const qlo = Math.ceil(Math.max(lo, d) / d), qhi = Math.floor(hi / d);
      if (qlo > qhi) continue;
      N = randInt(rng, qlo, qhi) * d;
    } else {
      N = randInt(rng, Math.max(lo, d), hi);
      if (N % d === 0 && tries < 400 && rng() < 0.85) continue;
    }
    last = { dividend: String(N), divisor: d };
    if (avoid && avoid.dividend === last.dividend && avoid.divisor === last.divisor && tries < 400) continue;
    return last;
  }
  return last || { dividend: "350", divisor: 25 };
}

function fracHTML(a, b) { return `<span class="frac"><span>${a}</span><span class="fbar"></span><span>${b}</span></span>`; }

/* Exact paper instructions for each gate: where the number goes + its place value. */
function gateText(s) {
  const last = v => String(v).slice(-1);
  switch (s.kind) {
    case "x": return `Put an <strong>X</strong> above the <strong>${s.digit}</strong> (${s.place} place). ${s.d} doesn't fit in ${s.partial}.`;
    case "quotient": return `Write <strong>${s.q}</strong> above the <strong>${s.digit}</strong>, in the ${s.place} place.`;
    case "product": return `Write <strong>${s.product}</strong> under ${s.partial}. Line up the <strong>${last(s.product)}</strong> under the <strong>${s.digit}</strong> (${s.place} place).`;
    case "diff": return `Draw a line under ${s.product}. Write <strong>${s.diff}</strong> below it, with the <strong>${last(s.diff)}</strong> under the <strong>${s.digit}</strong> (${s.place} place).`;
    case "bring": return s.diff > 0
      ? `Bring the <strong>${s.digit}</strong> straight down (${s.place} place). Write it next to the ${s.diff} to make <strong>${s.newPartial}</strong>.`
      : `Bring the <strong>${s.digit}</strong> straight down (${s.place} place). Write it next to the 0. Now you have <strong>${s.newPartial}</strong>.`;
    case "remainder": return `Write ${fracHTML(s.num, s.den)} above the bracket, right after the <strong>${s.quotient}</strong>.`;
    case "estimate": return s.rn ? `Write your estimate next to the problem: <strong>${fmt(s.rn)} ÷ ${fmt(s.rd)} = ${fmt(s.q)}</strong>, so the answer is about <strong>${fmt(s.q)}</strong>.` : "Write your estimate next to the problem.";
  }
  return "";
}


/* ================= ESTIMATE GATE (pure) =================
 * The kid types a rounded dividend, a rounded divisor and the quotient of those two.
 * Checked separately, in this order:
 *   close    – each rounded number is within ×½ … ×2 of the real one
 *   friendly – the pair is a mental-math pair (explicit list, or a basic fact scaled by powers of ten)
 *   math     – the kid divided the friendly pair correctly
 *   place    – the estimate has the same place value as the real quotient (the pass bar)
 */
// Explicit friendly pairs (compared after crossing off the same zeros from both numbers).
const FRIENDLY_PAIRS = [[10, 2], [10, 5], [20, 2], [25, 5], [50, 5], [50, 10], [100, 10], [100, 20], [100, 25],
  [100, 50], [200, 20], [1000, 100], [50, 25], [75, 25], [30, 3], [40, 4], [60, 6], [80, 8], [90, 9]];
function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function sig(x) { let z = 0; while (x > 0 && x % 10 === 0) { x /= 10; z++; } return { m: x, z }; }
function stripCommon(a, b) { while (a > 0 && b > 0 && a % 10 === 0 && b % 10 === 0) { a /= 10; b /= 10; } return [a, b]; }
function inFriendlyList(rn, rd) {
  const [a, b] = stripCommon(rn, rd);
  return FRIENDLY_PAIRS.some(([x, y]) => { const [p, q] = stripCommon(x, y); return p === a && q === b; });
}
/* Estimate is in the right ballpark: same place value as the real quotient, or within half to double of it (2,000 ÷ 20 = 100 for 1,987 ÷ 21 is fine). */
function sameScale(q, trueQ) { return String(q).length === String(trueQ).length || (trueQ > 0 && q / trueQ >= 0.5 && q / trueQ <= 2); }
function placeOfNumber(q) { return PLACES[String(q).length - 1] || "higher"; }

/* Is rn ÷ rd something a 5th grader can do in their head?  → {friendly, tier: "easy"|"borderline", q, fact, reason} */
function classifyPair(rn, rd) {
  if (!(rn > 0) || !(rd > 0)) return { friendly: false, reason: "zero" };
  const a = sig(rn), b = sig(rd);
  if (a.m > 199 || b.m > 99) return { friendly: false, reason: "digits" };
  if (rn < rd) return { friendly: false, reason: "small" };
  if (rn % rd !== 0) return { friendly: false, reason: "uneven" };
  const q = rn / rd, qs = sig(q).m;
  const fact = { F: b.m * qs, b: b.m, qs };
  const yes = (tier, extra) => Object.assign({ friendly: true, tier, q, fact: b.m === 1 ? null : fact }, extra || {});
  if (inFriendlyList(rn, rd)) return yes("easy");
  if (b.m === 1) return yes("easy");                                    // ÷ 10, 100, 1000: just cross off zeros
  if (b.m <= 9 && qs <= 9) {                                            // a times-table fact, scaled by tens
    const F = b.m * qs;
    return yes(F < 10 || F % 10 === 0 || b.m === 2 || b.m === 5 ? "easy" : "borderline");
  }
  if (b.m <= 12 && qs <= 12) return yes("easy");                        // 11s and 12s facts: 2400 ÷ 12, 1320 ÷ 11
  if (b.m === 2 || b.m === 5) return yes("easy");                       // halving, or ÷5 = double then ÷10: 1600 ÷ 50 = 32
  if (b.m === 25) return yes("easy", { quarters: true });               // ÷25 = ×4 then ÷100: 1600 ÷ 25 = 64, 3500 ÷ 25 = 140
  if ((b.m === 15 || b.m === 75) && qs <= 12) return yes("easy");       // 15s facts: 1500 ÷ 15, 1200 ÷ 15
  if (qs === 1 || qs === 2) return yes("easy");                         // same number or double: 1400 ÷ 14, 2800 ÷ 14
  return { friendly: false, reason: "fact", q };
}

/* Every friendly rounding near N ÷ d, best first. */
function estimateCandidates(N, d) {
  N = Number(N);
  const trueQ = Math.floor(N / d);
  const rds = new Set([d]);
  const p = Math.pow(10, String(d).length - 1);
  for (let k = 1; k <= 10; k++) rds.add(k * p);
  if (d >= 10) { rds.add(15); rds.add(25); rds.add(50); }
  const rns = new Set();
  const pn = Math.pow(10, String(N).length - 1);
  for (const P2 of [pn, pn / 10]) if (P2 >= 1) { rns.add(Math.floor(N / P2) * P2); rns.add(Math.ceil(N / P2) * P2); rns.add(Math.round(N / P2) * P2); }
  const out = [], seen = new Set();
  const plainRound = new Set(rns);   // straight roundings of N (others are "compatible numbers")
  for (const rd of rds) {
    if (rd <= 0 || rd / d < 0.6 || rd / d > 1.5) continue;
    const local = new Set(rns);
    for (let qs = 1; qs <= 9; qs++) for (let z = 0, t = 1; z <= 7; z++, t *= 10) local.add(rd * qs * t);
    for (const rn of local) {
      if (rn / N < 0.6 || rn / N > 1.6) continue;
      const key = rn + "/" + rd; if (seen.has(key)) continue; seen.add(key);
      const c = classifyPair(rn, rd);
      if (!c.friendly) continue;
      const placeMatch = sameScale(c.q, trueQ);
      const score = Math.abs(Math.log(rn / N)) + Math.abs(Math.log(rd / d)) + (c.tier === "borderline" ? 0.4 : 0) + (rd < d ? 0.15 : 0) + (rd === d ? -0.05 : 0) + (plainRound.has(rn) ? 0 : 0.2) + (placeMatch ? 0 : 5);
      out.push({ rn, rd, q: c.q, tier: c.tier, fact: c.fact, placeMatch, score });
    }
  }
  return out.sort((x, y) => x.score - y.score);
}
function bestEstimate(N, d) { return estimateCandidates(N, d).find(c => c.placeMatch) || null; }

function parseEst(v) {
  const s = String(v === undefined || v === null ? "" : v).replace(/[,\s]/g, "");
  if (!/^\d{1,9}$/.test(s)) return null;
  return parseInt(s, 10);
}
function nearbyRoundings(x) {
  const p = Math.pow(10, String(x).length - 1);
  const lo = Math.floor(x / p) * p, hi = Math.ceil(x / p) * p;
  return lo === hi ? [lo] : [lo, hi].filter(v => v > 0);
}

/* Nudge for an unfriendly pair: a friendly pair (default) plus an optional borderline one. */
function estimateNudge(N, d, rn, rd) {
  const cands = estimateCandidates(N, d).filter(c => c.placeMatch);
  let easy = null;
  const sr = sig(rd);
  if (sr.m > 9) {                                   // e.g. 150 → round UP to 200
    const p = Math.pow(10, String(rd).length - 1), up = Math.ceil(rd / p) * p;
    const c = classifyPair(rn, up);

    if (fits && rn / N >= 0.5 && rn / N <= 2 && up / d <= 2) easy = { rn, rd: up, q: c.q, tier: c.tier, fact: c.fact, roundedUp: true };

  if (!easy) easy = cands.find(c => c.rn === rn && c.tier === "easy" && c.rd >= rd)
    || cands.find(c => c.rn === rn && c.tier === "easy")
    || cands.find(c => c.tier === "easy") || cands[0] || null;
  if (easy && easy.rn === rn && easy.rd > rd) easy.roundedUp = true;
  const borderline = cands.find(c => c.rn === rn && c.rd !== rd && !(easy && easy.rn === c.rn && easy.rd === c.rd)) || null;   // a second pair that also works
  return { easy, borderline };
}

/* Check one estimate attempt. raw = {rn, rd, q} (strings). */
function evaluateEstimate(N, d, raw) {
  N = Number(N); d = Number(d);
  const rn = parseEst(raw && raw.rn), rd = parseEst(raw && raw.rd), q = parseEst(raw && raw.q);
  const trueQ = Math.floor(N / d);
  const r = { ok: false, N, d, rn, rd, q, trueQ, checks: { close: null, friendly: null, math: null, place: null } };
  if (rn === null || rd === null || q === null) { r.kind = "nan"; return r; }
  if (rd === 0 || rn === 0) { r.kind = rd === 0 ? "zeroDivisor" : "zeroDividend"; r.checks.close = false; return r; }
  if (rn / N < 0.5 || rn / N > 2) { r.kind = "farDividend"; r.checks.close = false; r.nearby = nearbyRoundings(N); return r; }
  if (rd / d < 0.5 || rd / d > 2) { r.kind = "farDivisor"; r.checks.close = false; r.nearby = nearbyRoundings(d); return r; }
  r.checks.close = true;
  const c = classifyPair(rn, rd);
  r.pair = c;
  if (!c.friendly) { r.kind = "unfriendly"; r.checks.friendly = false; r.nudge = estimateNudge(N, d, rn, rd); return r; }
  r.checks.friendly = true; r.tier = c.tier;
  if (q !== c.q) { r.kind = "slip"; r.checks.math = false; return r; }
  r.checks.math = true;
  if (!sameScale(q, trueQ)) {
    r.kind = "place"; r.checks.place = false;
    r.estPlace = placeOfNumber(q); r.truePlace = placeOfNumber(trueQ);
    r.suggestion = bestEstimate(N, d);
    return r;
  }
  r.checks.place = true; r.ok = true;
  r.kind = c.tier === "borderline" ? "borderline" : "pass";
  if (c.tier === "borderline") {
    const f = estimateCandidates(N, d).filter(x => x.placeMatch && x.tier === "easy");
    r.friendlier = f.find(x => x.rn === rn) || f.find(x => x.rd === rd) || f[0] || null;
  }
  return r;
}

/* Coaching message (HTML) for an estimate result. tries = attempts so far, including this one. */
function estimateMessage(r, tries) {
  tries = tries || 1;
  const pair = (a, b) => `<span class="try-pair">${fmt(a)} ÷ ${fmt(b)}</span>`;
  const factTail = c => c && c.fact ? ` (think ${c.fact.F} ÷ ${c.fact.b})` : (c && sig(c.rd).m === 1 ? " (just cross off zeros)" : "");
  const knowIt = c => c && c.fact ? "is a fact you know" : "is easy to do in your head";
  switch (r.kind) {
    case "nan": return "Fill in all three boxes: your rounded dividend, your rounded divisor, and your estimate. Use whole numbers.";
    case "zeroDivisor": return `We can't divide by 0! Round ${fmt(r.d)} to a number close to it, like ${nearbyRoundings(r.d).map(fmt).join(" or ")}.`;
    case "zeroDividend": return `Round ${fmt(r.N)} to a number close to it, like ${nearbyRoundings(r.N).map(fmt).join(" or ")}.`;
    case "farDividend": return `Hmm, ${fmt(r.rn)} is pretty far from ${fmt(r.N)}. Round to a number close to ${fmt(r.N)}, like ${r.nearby.map(fmt).join(" or ")}.`;
    case "farDivisor": return `Hmm, ${fmt(r.rd)} is pretty far from ${fmt(r.d)}. Round to a number close to ${fmt(r.d)}, like ${r.nearby.map(fmt).join(" or ")}.`;
    case "unfriendly": {
      const a = sig(r.rn), b = sig(r.rd), c = r.pair;
      let why = "";
      if (c.reason === "digits") why = `${fmt(a.m > 99 ? r.rn : r.rd)} has too many digits that aren't zero.`;
      else if (b.m > 12 && b.m !== 15 && b.m !== 25 && b.m !== 75) why = `${fmt(r.rd)} is a tricky number to divide by.`;
      else if (c.reason === "uneven") why = `${a.m} isn't in the ${b.m}s facts, so it doesn't come out even.`;
      else if (c.reason === "fact") why = `That's not a basic division fact.`;
      else if (c.reason === "small") why = `${fmt(r.rn)} is smaller than ${fmt(r.rd)}.`;
      let msg = `🤔 Can you do ${pair(r.rn, r.rd)} in your head? ${why}`;
      const e = r.nudge.easy, bl = r.nudge.borderline;
      msg += e && e.roundedUp ? " That's not quite a mental-math number — try rounding up." : " That's not quite a mental-math number — try a friendlier pair.";
      if (e) {
        if (e.rn === r.rn && e.rd > r.rd) msg += ` Round ${fmt(r.rd)} up to <b>${fmt(e.rd)}</b>: then ${pair(e.rn, e.rd)} ${knowIt(e)}${factTail(e)}.`;
        else if (e.rn === r.rn) msg += ` Try ${pair(e.rn, e.rd)} instead${factTail(e)}.`;
        else if (e.rd === r.rd) msg += ` Try rounding ${fmt(r.N)} to <b>${fmt(e.rn)}</b>: ${pair(e.rn, e.rd)}${factTail(e)}.`;
        else msg += ` Try ${pair(e.rn, e.rd)}${factTail(e)}.`;
      }
      if (bl) msg += ` Or, if you know ${bl.fact ? `${bl.fact.F} ÷ ${bl.fact.b}` : "your quarters"}, ${pair(bl.rn, bl.rd)} might work too.`;
      return msg;
    }
    case "slip": {
      const [a, b] = stripCommon(r.rn, r.rd);
      let msg = `✓ ${pair(r.rn, r.rd)} is a great mental-math pair! But check your division: it isn't ${fmt(r.q)}. Check it: ${fmt(r.q)} × ${fmt(r.rd)} = ${fmt(r.q * r.rd)}, not ${fmt(r.rn)}.`;
      if (a !== r.rn) msg += ` Tip: cross off the same number of zeros from both. ${fmt(r.rn)} ÷ ${fmt(r.rd)} is the same as ${fmt(a)} ÷ ${fmt(b)}.`;
      return msg;
    }
    case "place": {
      let msg = `${fmt(r.rn)} ÷ ${fmt(r.rd)} = ${fmt(r.q)}: nice math! ✓ But ${fmt(r.q)} is in the <b>${r.estPlace}</b>, and the real answer to ${fmt(r.N)} ÷ ${fmt(r.d)} will be in the <b>${r.truePlace}</b>. Try rounding a different way.`;
      if (tries >= 2 && r.suggestion) msg += ` Maybe try ${pair(r.suggestion.rn, r.suggestion.rd)}.`;
      return msg;
    }
    case "borderline": {
      let msg = `✓ Good estimate! ${pair(r.rn, r.rd)} works if you know ${r.pair.fact ? `${r.pair.fact.F} ÷ ${r.pair.fact.b} = ${r.pair.fact.qs}` : "your quarters (4 quarters make 100)"}.`;
      if (r.friendlier) msg += ` An even friendlier pair next time: ${pair(r.friendlier.rn, r.friendlier.rd)}.`;
      return msg;
    }
    case "pass": return String(r.q).length === String(r.trueQ).length
      ? `✓ Great estimate! You can do ${pair(r.rn, r.rd)} in your head, and ${fmt(r.q)} is in the ${placeOfNumber(r.q)}, just like the real answer will be.`
      : `✓ Great estimate! You can do ${pair(r.rn, r.rd)} in your head, and the real answer should be close to ${fmt(r.q)}.`;
  }
  return "";
}

/* Full lesson: estimate → paper gate → the algorithm → "is it reasonable?" → done. */
function buildLesson(dividendStr, divisor) {
  const B = buildSteps(dividendStr, divisor);
  const N = parseInt(B.dividend, 10), trueQ = Math.floor(N / divisor);
  const done = B.steps.pop();
  B.steps.unshift({ type: "estimate", N, d: divisor, trueQ }, { type: "gate", kind: "estimate", N, d: divisor });
  B.steps.push({ type: "reasonable", d: divisor, quotient: B.quotient, remainder: B.remainder, trueQ }, done);

</script>

<!-- ================= UI / STATE MACHINE ================= -->

/* ---------- start screen ---------- */

  P = buildLesson(dividend, divisor);
  P.tag = tag;
  P.est = { rn: "", rd: "", q: "" };   // what the kid typed in the estimate boxes (kept when rewinding)
  P.estResult = null; P.estimate = null; P.recheck = false; P.reasonableOk = false;
  idx = 0; attempts = {}; animIdx = -1; gateLock = false;
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("mainScreen").classList.remove("hidden");
  document.getElementById("ptitle").textContent = `${P.dividend} ÷ ${P.divisor}`;
  render();
}

/* ---------- FSM transitions (only these move idx) ---------- */
function advance() {               // called only after a validated answer / action / gate tap
  if (idx >= P.steps.length - 1) return;
  animIdx = idx;
  idx++;
  P.recheck = false;
  render();
}
/* Jump back to an earlier state (used by "which step do you want to recheck?"). Work after it is cleared. */
function rewindTo(i) {
  if (!P || i < 0 || i >= idx) return;
  Object.keys(attempts).forEach(k => { if (+k >= i) delete attempts[k]; });
  idx = i; animIdx = -1; gateLock = false; P.recheck = false; P.reasonableOk = false;
  if (P.steps[idx].type === "estimate") P.estResult = null;
  render();
}
function goBack() {                // rewind one state, clearing what was typed there
  if (!P || idx === 0) return;
  delete attempts[idx];
  idx--;
  delete attempts[idx];
  animIdx = -1; gateLock = false; P.recheck = false; P.reasonableOk = false;
  if (P.steps[idx].type === "estimate") P.estResult = null;
  render();
}

function submitAnswer() {
  const s = P.steps[idx];
  let raw;
  if (s.type === "remainder") raw = { num: val("numIn"), den: val("denIn") };
  else raw = val("answerInput");
  const r = checkStep(s, raw);
  const fb = document.getElementById("feedback");
  if (r.ok) { advance(); return; }
  fb.className = "feedback wrong";
  if (r.kind === "nan") { fb.textContent = "Type a number."; return; }
  if (s.type === "compare") { fb.innerHTML = `Look again: ${s.diff} is less than ${s.d}. Tap <b>Yes</b>.`; return; }
  if (s.type === "check") {
    (attempts[idx] = attempts[idx] || []).push(r);
    render();
    const f2 = document.getElementById("feedback");
    f2.className = "feedback wrong";
    f2.innerHTML = r.kind === "tooBig"
      ? `Too big! ${r.v} × ${s.d} = ${r.product}, more than ${s.partial}.`
      : `Too small! ${s.d} still fits one more time.`;
    return;
  }
  attempts[idx] = (attempts[idx] || 0) + 1;
  if (s.type === "multiply") {
    fb.innerHTML = "Not quite. Try again." + (attempts[idx] >= 2 ? `<div class="hint">Hint: ${s.q > 0 ? "count by " + s.d + "s: " + Array.from({ length: s.q }, (_, i) => (i + 1) * s.d).join(", ") : "anything × 0 = 0"}</div>` : "");
  } else if (s.type === "subtract") {
    fb.innerHTML = "Not quite. Try again." + (attempts[idx] >= 2 ? `<div class="hint">Hint: start with the ones. Regroup if you need to.</div>` : "");
  } else if (s.type === "remainder") {
    fb.innerHTML = {
      num: "Top = what's left over.",
      den: "Bottom = the divisor.",
      both: "Top = left over. Bottom = divisor."
    }[r.kind] || "Not quite. Try again.";
  }
  const inp = document.getElementById(s.type === "remainder" ? (r.kind === "den" ? "denIn" : "numIn") : "answerInput");
  if (inp) { inp.select(); inp.focus(); }
}
function val(id) { const el = document.getElementById(id); return el ? el.value : ""; }

function answerCompare(v) { const s = P.steps[idx]; if (s.type !== "compare") return; const r = checkStep(s, v); if (r.ok) advance(); else submitCompareWrong(s); }
function submitCompareWrong(s) { const fb = document.getElementById("feedback"); fb.className = "feedback wrong"; fb.innerHTML = `Look again: ${s.diff} is less than ${s.d}. Tap <b>Yes</b>.`; }
function submitEstimate() {
  const s = P.steps[idx];
  if (s.type !== "estimate") return;
  P.est = { rn: val("estN"), rd: val("estD"), q: val("estQ") };
  const r = evaluateEstimate(s.N, s.d, P.est);
  attempts[idx] = (attempts[idx] || 0) + (r.kind === "nan" ? 0 : 1);
  P.estResult = r;
  if (r.ok) {
    P.estimate = { rn: r.rn, rd: r.rd, q: r.q, kind: r.kind, msg: estimateMessage(r, attempts[idx]) };
    Object.assign(P.steps[idx + 1], { rn: r.rn, rd: r.rd, q: r.q });
    advance();
    return;
  }
  render();
  const focusId = r.kind === "nan" ? (["estN", "estD", "estQ"].find(id => !val(id).trim()) || "estN")
    : r.checks.close === false ? (r.kind === "farDivisor" || r.kind === "zeroDivisor" ? "estD" : "estN")
    : r.kind === "slip" ? "estQ" : r.kind === "unfriendly" ? (sig(r.rd).m > 9 ? "estD" : "estN") : "estN";
  const el = document.getElementById(focusId); if (el) { el.focus(); el.select(); }
}
function estKey(e, nextId) {
  if (e.key !== "Enter") return;
  e.preventDefault();
  if (nextId && !document.getElementById(nextId).value.trim()) document.getElementById(nextId).focus(); else submitEstimate();
}
function answerReasonable(yes) {
  if (P.steps[idx].type !== "reasonable") return;
  if (yes) { P.reasonableOk = true; advance(); }
  else { P.recheck = true; render(); }
}
function recheckOptions() {
  const opts = [];
  P.steps.forEach((s, i) => {
    if (s.type === "estimate" && P.estimate) opts.push({ i, label: `My estimate (${fmt(P.estimate.rn)} ÷ ${fmt(P.estimate.rd)} = ${fmt(P.estimate.q)})` });
    if (s.type === "check" && !s.leadingZero) opts.push({ i, label: `The ${s.expected} in the ${s.place} place` });
  });
  return opts;
}
function doBringDown() { if (P.steps[idx].type === "bring") advance(); }
function gateTapped(cb) {
  if (!cb.checked || gateLock) return;
  gateLock = true;
  setTimeout(() => { gateLock = false; advance(); }, 300);
}

/* ---------- rendering ---------- */
function isDone(i) { return i < idx; }

function cellSize() { return window.innerWidth < 480 ? 36 : 46; }

function renderBracket() {
  const W = cellSize(), H = W + 6;
  const n = P.n, dStr = String(P.divisor);
  const LEFT = (dStr.length + 1) * W + 12;
  const X = c => LEFT + c * W;
  const Y = r => (r + 1) * H;            // r = -1 is the quotient row
  const cur = P.steps[idx];
  const out = [];
  const cell = (c, r, txt, cls, extra) =>
    out.push(`<div class="cell ${cls || ""}" style="left:${X(c)}px;top:${Y(r)}px;width:${W}px;height:${H}px;${extra || ""}">${txt}</div>`);

  // which dividend digits have been brought down, quotient marks, written rows
  const brought = new Set(), q = {}, rows = [];
  P.steps.forEach((s, i) => {
    if (!isDone(i)) return;
    if (s.type === "check") q[s.e] = { txt: s.leadingZero ? "X" : String(s.expected), x: s.leadingZero, anim: i === animIdx };
    if (s.type === "multiply") rows.push({ kind: "product", s, anim: i === animIdx });
    if (s.type === "subtract") rows.push({ kind: "diff", s, anim: i === animIdx });
    if (s.type === "bring") { brought.add(s.col); rows.push({ kind: "bring", s, anim: i === animIdx }); }
  });

  // gate target (the cell(s) that just resolved)
  const tgt = new Set();
  let alignCol = -1, lineTarget = false;   // during a gate: which dividend digit to line up with, and whether the new line pulses
  const mark = (c, r) => tgt.add(c + "," + r);
  if (cur.type === "gate") {
    if (cur.kind === "x" || cur.kind === "quotient") { mark(cur.e, -1); alignCol = cur.e; }
    if (cur.kind === "product") { const L = String(cur.product).length; for (let k = 0; k < L; k++) mark(cur.e - k, cur.row); alignCol = cur.e; }
    if (cur.kind === "diff") { const L = String(cur.diff).length; for (let k = 0; k < L; k++) mark(cur.e - k, cur.row); alignCol = cur.e; lineTarget = true; }
    if (cur.kind === "bring") { mark(cur.col, cur.row); alignCol = cur.col; }
    if (cur.kind === "remainder") mark(n, -1);
  }
  // highlight for the current input state
  const hl = new Set();
  const hlRange = (r, a, b) => { for (let c = a; c <= b; c++) hl.add(c + "," + r); };
  let quotHL = -1, divHL = false, nextHL = -1, destHL = null;
  if (cur.type === "check") hlRange(cur.row, cur.from, cur.e);
  if (cur.type === "multiply") { quotHL = cur.e; divHL = true; }
  if (cur.type === "subtract") { hlRange(cur.row - 2, cur.from === undefined ? 0 : cur.from, cur.e); }
  if (cur.type === "bring") { nextHL = cur.col; destHL = cur.col + "," + cur.row; }
  if (cur.type === "subtract") {
    // highlight the partial (above) and the product (one row up)
    const ck = P.steps.slice(0, idx).reverse().find(s => s.type === "check");
    hl.clear(); hlRange(ck.row, ck.from, ck.e);
    const L = String(cur.product).length; for (let k = 0; k < L; k++) hl.add((cur.e - k) + "," + (cur.row - 1));
  }
  if (cur.type === "compare") { const L = String(cur.diff).length; for (let k = 0; k < L; k++) hl.add((cur.e - k) + "," + cur.row); divHL = true; }
  if (cur.type === "remainder") { const L = String(cur.num).length; for (let k = 0; k < L; k++) hl.add((P.n - 1 - k) + "," + (P.rows - 1)); }
  const cls = (c, r, base) => base + (tgt.has(c + "," + r) ? " target" : "") + (hl.has(c + "," + r) ? " hl" : "");

  // divisor (outside, left)
  const dl = dStr.length;
  for (let k = 0; k < dl; k++) cell(k - dl - 1, 0, dStr[k], "divisor" + (divHL ? " hl" : ""), "");
  // bracket: curve + top bar
  out.push(`<div class="bar-curve" style="left:${X(-1) + W * 0.25}px;top:${Y(0) - 2}px;width:${W * 0.6}px;height:${H + 6}px"></div>`);
  out.push(`<div class="bar-top" style="left:${X(-1) + W * 0.55}px;top:${Y(0) - 3}px;width:${n * W + W * 0.45 + 4}px"></div>`);
  // quotient slots
  for (let c = 0; c < n; c++) {
    const m = q[c];
    let base = "slot" + (m ? " filled" : "") + (m && m.x ? " qx" : "") + (m && m.anim ? " pop" : "") + (quotHL === c ? " hl" : "");
    if (P.steps[idx].type === "done" && m && m.x) base += " qx";
    cell(c, -1, m ? m.txt : "", cls(c, -1, base));
  }
  // dividend digits
  for (let c = 0; c < n; c++) {
    let base = (brought.has(c) ? "used" : "") + (nextHL === c ? " hl next" : "") + (alignCol === c ? " align" : "");
    cell(c, 0, P.dividend[c], cls(c, 0, base));
  }
  // work rows
  rows.forEach(w => {
    const s = w.s;
    if (w.kind === "product") {
      const t = String(s.product);
      for (let k = 0; k < t.length; k++) { const c = s.e - t.length + 1 + k; cell(c, s.row, t[k], cls(c, s.row, w.anim ? "appear" : "")); }
      const a = Math.min(s.from, s.e - t.length + 1);
      cell(a - 1, s.row, "−", "op" + (w.anim ? " appear" : ""));
    }
    if (w.kind === "diff") {
      const a = Math.min(s.from, s.e - String(s.product).length + 1);
      out.push(`<div class="hline${w.anim ? " appear" : ""}${lineTarget && s.row === cur.row ? " target-line" : ""}" style="left:${X(a) - 2}px;top:${Y(s.row - 1) + H - 2}px;width:${(s.e - a + 1) * W + 4}px"></div>`);
      const t = String(s.diff);
      for (let k = 0; k < t.length; k++) { const c = s.e - t.length + 1 + k; cell(c, s.row, t[k], cls(c, s.row, w.anim ? "appear" : "")); }
    }
    if (w.kind === "bring") {
      cell(s.col, s.row, String(s.digit), cls(s.col, s.row, w.anim ? "drop" : ""), w.anim ? `--dy:${-(s.row) * H}px;` : "");
    }
  });
  // remainder fraction written in the quotient row, right after the quotient (like on paper)
  const showFrac = P.remainder > 0 && (cur.type === "done" || cur.type === "reasonable" || (cur.type === "gate" && cur.kind === "remainder"));
  if (showFrac) out.push(`<div class="cell qfrac${tgt.has(n + ",-1") ? " target" : ""}${animIdx === idx - 1 && cur.type === "gate" ? " pop" : ""}" style="left:${X(n) + 4}px;top:${Y(-1) - 6}px;width:${W * 1.3}px;height:${H + 8}px">${fracHTML(P.remainder, P.divisor)}</div>`);
  if (destHL) { const [c, r] = destHL.split(",").map(Number); cell(c, r, "", "dest"); }

  const minCol = -dl - 1, maxCol = n + (P.remainder > 0 ? 1.5 : 0);
  // grow the mat as the work grows (keeps the step panel close on short Chromebook screens)
  let usedRow = 0;
  P.steps.forEach((st, i) => { if (i <= idx && typeof st.row === "number") usedRow = Math.max(usedRow, st.row); });
  if (cur.type === "done" || cur.type === "reasonable" || cur.type === "remainder" || (cur.type === "gate" && cur.kind === "remainder")) usedRow = P.rows - 1;
  const width = X(maxCol) + 8, height = Y(usedRow + 1) + 12;
  const el = document.getElementById("bracket");
  el.style.width = width + "px"; el.style.height = height + "px";
  el.style.fontSize = (W * 0.72) + "px";
  el.innerHTML = out.join("");
}

function stepNumber() {
  // count only the "doing" states for the kid-facing counter, like "Step 3 of 9"
  return { cur: idx + 1, total: P.steps.length };
}

function renderLoop() {
  const s = P.steps[idx];
  let phase = s.type;
  if (s.type === "gate") phase = { x: "check", quotient: "check", product: "multiply", diff: "subtract", bring: "bring", remainder: "remainder", estimate: "estimate" }[s.kind];
  if (s.type === "done") phase = "";
  const names = [["check", "Check"], ["multiply", "Multiply"], ["subtract", "Subtract"], ["compare", "Compare"], ["bring", "Bring down"]];
  let html = `<span class="${phase === "estimate" ? "on" : ""}">Estimate</span><i>·</i>` + names.map(([k, t]) => `<span class="${phase === k ? "on" : ""}">${t}</span>`).join("<i>→</i>");
  if (phase === "remainder") html += `<i>→</i><span class="on">Remainder</span>`;
  html += `<i>·</i><span class="${phase === "reasonable" ? "on" : ""}">Reasonable?</span>`;
  document.getElementById("loop").innerHTML = html;
}

function answerHTML() {
  return `${P.dividend} ÷ ${P.divisor} = ${P.quotient}${P.remainder > 0 ? " " + fracHTML(P.remainder, P.divisor) : ""}`;
}

function render() {
  const s = P.steps[idx];
  renderBracket();
  renderLoop();
  const box = document.getElementById("step");
  const { cur, total } = stepNumber();
  let html = "";
  const prev = P.steps[idx - 1];
  const justAnswered = s.type === "gate" && prev && ["check", "multiply", "subtract", "remainder"].includes(prev.type) && animIdx === idx - 1;
  const inputBox = (label, w) => `<input id="answerInput" class="answer" inputmode="numeric" autocomplete="off" aria-label="${label}" onkeydown="if(event.key==='Enter') submitAnswer()">`;
  const checkBtn = `<button class="check" onclick="submitAnswer()">Check</button>`;

  if (s.type === "estimate") {
    const e = P.est, r = P.estResult;
    html += `<div class="ask">🧠 First, estimate!</div>`;
    html += `<div class="est-sub">Round <b>${fmt(P.dividend)}</b> and <b>${P.divisor}</b> to numbers you can divide in your head.</div>`;
    const field = (id, v, label, next, extra) => `<label class="est-field"><input id="${id}" class="${extra || ""}" inputmode="numeric" autocomplete="off" aria-label="${label}" value="${String(v).replace(/"/g, "")}" onkeydown="estKey(event, ${next ? `'${next}'` : "null"})"><small>${label}</small></label>`;
    html += `<div class="est-row">${field("estN", e.rn, "rounded " + fmt(P.dividend), "estD")}<span class="est-op">÷</span>${field("estD", e.rd, "rounded " + P.divisor, "estQ")}<span class="est-op">=</span>${field("estQ", e.q, "your estimate", null, "q")}</div>`;
    html += `<div class="input-area"><button class="check" id="estBtn" onclick="submitEstimate()">Check my estimate</button></div>`;
    if (r && r.kind !== "nan") {
      const chip = (v, t) => `<span class="chk ${v === true ? "good" : v === false ? "bad" : ""}">${v === true ? "✓ " : v === false ? "✗ " : ""}${t}</span>`;
      html += `<div class="est-checks">${chip(r.checks.close, "Rounded close")}${chip(r.checks.friendly, "Mental-math numbers")}${chip(r.checks.math, "Division right")}${chip(r.checks.place, "Place value")}</div>`;
    }
    html += r ? `<div id="feedback" class="feedback coach">${estimateMessage(r, attempts[idx] || 1)}</div>` : `<div id="feedback" class="feedback"></div>`;
  } else if (s.type === "reasonable") {
    const E = P.estimate || { q: "?" };
    if (!P.recheck) {
      html += `<div class="ask">Is your answer reasonable compared to your estimate?</div>`;
      html += `<div class="reason-compare"><div><small>Your answer</small><b>${P.quotient}${P.remainder > 0 ? " " + fracHTML(P.remainder, P.divisor) : ""}</b></div><div><small>Your estimate</small><b>≈ ${fmt(E.q)}</b></div></div>`;
      html += `<div class="input-area"><button class="yn" id="reasYes" onclick="answerReasonable(true)">Yes</button><button class="yn" id="reasNo" onclick="answerReasonable(false)">No</button></div>`;
      html += `<div class="mini-note">Are they in the same place value? Are they close?</div>`;
    } else {
      html += `<div class="ask">Good thinking: let's double-check! 🔍</div><div class="est-sub">Which step do you want to recheck?</div>`;
      html += `<div class="recheck" id="recheck">${recheckOptions().map(o => `<button class="pick" onclick="rewindTo(${o.i})">${o.label}</button>`).join("")}<button class="link" id="recheckCancel" onclick="P.recheck=false;render()">← Back to the question</button></div>`;
      html += `<div class="mini-note">We'll go back to that step. You'll redo the work from there.</div>`;
    }
  } else if (s.type === "check") {
    html += `<div class="ask">How many times does <b>${s.d}</b> go into <b>${s.partial}</b> without going over?</div>`;
    html += `<div class="input-area">${inputBox("How many times")}${checkBtn}</div>`;
    const tries = attempts[idx] || [];
    if (tries.length) html += `<div class="tries">${tries.map(t => `<span class="try" title="${t.kind === "tooBig" ? "too big" : "too small"}">${t.v} <span class="x">✗</span></span>`).join("")}</div>`;
    html += `<div id="feedback" class="feedback"></div>`;
  } else if (s.type === "multiply" || s.type === "subtract") {
    const top = s.type === "multiply" ? s.d : s.partial, op = s.type === "multiply" ? "×" : "−", bot = s.type === "multiply" ? s.q : s.product;
    html += `<div class="ask">${s.type === "multiply" ? "Multiply" : "Subtract"}</div>`;
    html += `<div class="input-area"><div class="mini">
        <div class="mrow"><span>${top}</span></div>
        <div class="mrow"><span class="opc">${op}</span><span>${bot}</span></div>
        <div class="mline"></div>
        <div class="mrow"><input id="answerInput" inputmode="numeric" autocomplete="off" aria-label="${s.type === "multiply" ? "Product" : "Difference"}" onkeydown="if(event.key==='Enter') submitAnswer()"></div>
      </div>${checkBtn}</div>
      <div id="feedback" class="feedback"></div>`;
  } else if (s.type === "compare") {
    html += `<div class="ask">Is <b>${s.diff}</b> smaller than <b>${s.d}</b>?</div>`;
    html += `<div class="input-area"><button class="yn" id="yesBtn" onclick="answerCompare('yes')">Yes</button><button class="yn" onclick="answerCompare('no')">No</button></div>`;
    html += `<div class="mini-note">Your remainder must be smaller than the divisor. If not, your quotient digit was too small.</div>`;
    html += `<div id="feedback" class="feedback"></div>`;
  } else if (s.type === "bring") {
    html += `<div class="ask">Bring down the next digit.</div>`;
    html += `<div class="input-area"><button id="bringBtn" class="check" onclick="doBringDown()">⬇ Bring down the ${s.digit}</button></div>`;
  } else if (s.type === "remainder") {
    html += `<div class="ask"><b>${s.num}</b> is left over. Write it as a fraction.</div>`;
    html += `<div class="input-area"><div class="mini" style="display:flex;align-items:center;gap:12px">
        <span>${s.quotient}</span>
        <span class="frac"><input id="numIn" inputmode="numeric" autocomplete="off" aria-label="Numerator: left over" onkeydown="if(event.key==='Enter') document.getElementById('denIn').focus()"><span class="fbar"></span><input id="denIn" inputmode="numeric" autocomplete="off" aria-label="Denominator: divisor" onkeydown="if(event.key==='Enter') submitAnswer()"></span>
        <span class="frac-labels"><span>← left over</span><span>← divisor</span></span>
      </div>${checkBtn}</div>
      <div id="feedback" class="feedback"></div>`;
  } else if (s.type === "gate") {
    if (s.kind === "estimate" && P.estimate && animIdx === idx - 1) html += `<div class="est-good">${P.estimate.msg}</div>`;
    if (justAnswered) html += `<div class="feedback correct" style="margin:0 0 8px">${prev.type === "check" && prev.leadingZero ? "Right! It goes 0 times." : "Correct!"}</div>`;
    html += `<div class="gate-head">✏️ Write it on your paper</div><div class="gate-text">${gateText(s)}</div>
      <label class="gate-check"><input type="checkbox" id="gateBox" onchange="gateTapped(this)"> I wrote it</label>`;
  }
  box.innerHTML = html;
  box.classList.toggle("hidden", s.type === "done");
  box.classList.toggle("gate", s.type === "gate");

  const fin = document.getElementById("final");
  if (s.type === "done") {
    fin.classList.remove("hidden");
    fin.innerHTML = `<div style="font-size:1rem;font-weight:normal;margin-bottom:6px">🎉 You did it! Does your paper match?</div><div style="font-size:1.6rem">${answerHTML()}</div>${P.reasonableOk ? `<div class="reason-ok"><span class="big-check">✓</span><span>Reasonable! Your estimate was about ${fmt(P.estimate.q)}.</span></div>` : ""}<div class="controls" style="margin-top:14px"><button id="nextBtn" class="big" onclick="nextProblem()">Next problem →</button></div>`;
  } else fin.classList.add("hidden");

  document.getElementById("progress").textContent = `Progress: ${cur} / ${total}`;
  document.getElementById("backBtn").disabled = idx === 0;

  // focus the active control so Enter / Space works on a Chromebook
  const firstEmpty = ["estN", "estD", "estQ"].map(id => document.getElementById(id)).find(el => el && !el.value);
  const focusEl = firstEmpty || document.getElementById("estN") || document.getElementById("reasYes") || document.getElementById("answerInput") || document.getElementById("numIn") || document.getElementById("gateBox") || document.getElementById("yesBtn") || document.getElementById("bringBtn") || document.getElementById("nextBtn");
  if (focusEl) { focusEl.focus({ preventScroll: true }); }
  const target = s.type === "done" ? fin : document.querySelector("#mainScreen .controls");
  if (target.getBoundingClientRect().bottom > window.innerHeight) target.scrollIntoView({ block: "end", behavior: "smooth" });
}

window.addEventListener("resize", () => { if (P && !document.getElementById("mainScreen").classList.contains("hidden")) renderBracket(); });
</script>
